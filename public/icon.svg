<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f15" />
      <stop offset="50%" stop-color="#0a3a28" />
      <stop offset="100%" stop-color="#03160e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Subtle ornamental border -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="12 6" />
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Center glow -->
  <circle cx="256" cy="240" r="180" fill="url(#glowGrad)" />

  <!-- Islamic Geometric Star Motif / Lantern / Crescent & Book Symbol -->
  <g filter="url(#goldShadow)">
    <!-- Crescent Moon -->
    <path d="M 285 110 C 205 118 145 185 145 265 C 145 350 215 418 300 415 C 330 414 360 403 382 388 C 345 398 290 385 258 350 C 218 305 220 235 264 190 C 285 168 318 152 350 148 C 328 128 307 114 285 110 Z" fill="url(#goldGrad)" />

    <!-- Radiant 8-pointed star in the crescent cradle -->
    <g transform="translate(325, 215) scale(0.85)">
      <!-- Octagram -->
      <polygon points="0,-48 14,-14 48,0 14,14 0,48 -14,14 -48,0 -14,-14" fill="url(#goldGrad)" />
      <polygon points="-34,-34 0,-20 34,-34 20,0 34,34 0,20 -34,34 -20,0" fill="url(#goldGrad)" opacity="0.9" />
      <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
    </g>

    <!-- Quran Stand / Book Emblem at base -->
    <g transform="translate(256, 330)">
      <!-- Open Quran Pages -->
      <path d="M -65 15 C -45 5, -15 12, 0 25 C 15 12, 45 5, 65 15 C 60 28, 40 24, 0 35 C -40 24, -60 28, -65 15 Z" fill="url(#goldGrad)" opacity="0.95" />
      <path d="M -60 20 C -40 10, -15 18, 0 30 C 15 18, 40 10, 60 20 C 50 28, 30 24, 0 35 C -30 24, -50 28, -60 20 Z" fill="#FFF2B2" opacity="0.6" />
      <!-- Stand legs (Rehal) -->
      <path d="M -30 33 L -55 70 L -42 70 L -18 38 L 0 35 L 18 38 L 42 70 L 55 70 L 30 33 Z" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Noor Calligraphy / Name styling in Arabic -->
  <text x="256" y="445" font-family="'Amiri', 'Cairo', 'Traditional Arabic', serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">نُـــــور</text>
  <text x="256" y="475" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#E6CA65" text-anchor="middle" letter-spacing="6">NOOR</text>
</svg>
